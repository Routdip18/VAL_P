<!DOCTYPE html>
<html>
<head>
<title>Will You Be My Valentine? ❤️</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(to top,#ff758c,#ff7eb3);
    font-family:Arial;
    text-align:center;
    color:white;
}

h1{ margin-top:60px; }

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:20px;
}

#yesBtn{ background:#ff2e63; color:white; }
#noBtn{ background:#333; color:white; position:absolute; }

#scene{ display:none; position:relative; height:450px; }

svg{ width:600px; height:400px; }

/* WALK ANIMATION */
#boy{
    animation:walk 3s forwards;
}

@keyframes walk{
    from{ transform:translateX(-250px); }
    to{ transform:translateX(0); }
}

/* KNEEL ANIMATION */
#boy.kneel #body{
    transform:rotate(15deg);
    transform-origin:top center;
    transition:0.6s ease;
}

#boy.kneel #leg1{
    transform:rotate(70deg);
    transform-origin:top left;
    transition:0.6s ease;
}

#boy.kneel #leg2{
    transform:translateY(20px);
    transition:0.6s ease;
}

#boy.kneel #arm{
    transform:rotate(-30deg);
    transform-origin:left center;
    transition:0.6s ease;
}

/* Ring */
#ring{
    opacity:0;
    transition:1s ease;
}

#boy.kneel + #ring{
    opacity:1;
}

/* Floating Hearts */
.heart{
    position:absolute;
    color:red;
    font-size:20px;
    animation:float 5s linear infinite;
}

@keyframes float{
    from{ transform:translateY(0); opacity:1; }
    to{ transform:translateY(-600px); opacity:0; }
}

#message{
    display:none;
    font-size:22px;
    width:70%;
    margin:auto;
    margin-top:20px;
}
</style>
</head>

<h1 id="question">Will You Be My Valentine? ❤️</h1>
<button id="yesBtn" onclick="start()">Yes 💖</button>
<button id="noBtn" onmouseover="moveBtn()">No 😜</button>

<div id="scene">

    <!-- Front Leg (kneeling leg) -->
    <rect id="leg1" x="185" y="275" width="12" height="50" fill="#2c3e50"/>

    <rect id="leg2" x="203" y="275" width="12" height="50" fill="#2c3e50"/>
    
    <!-- Arm (holding ring) -->

</g>

<!-- Ring -->
<circle id="ring" cx="300" cy="230" r="8" fill="gold"/>

</svg>
</div>

<div id="message"></div>
