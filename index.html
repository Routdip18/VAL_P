<!DOCTYPE html>
<html>
<head>
<title>Our Moment ❤️</title>

<style>
body{
margin:0;
overflow:hidden;
background:linear-gradient(to top,#ff758c,#ff7eb3);
font-family:Arial;
text-align:center;
color:white;
}

h1{ margin-top:60px; }

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
margin:20px;
}

#yesBtn{ background:#ff2e63; color:white; }
#noBtn{ background:#333; color:white; position:absolute; }

#scene{ display:none; position:relative; height:450px; }

svg{ width:600px; height:400px; }

#boy{
animation:walk 3s forwards;
}

@keyframes walk{
from{ transform:translateX(-250px); }
to{ transform:translateX(0); }
}

#knee{
animation:kneel 1s forwards;
animation-delay:3s;
}

@keyframes kneel{
to{ transform:translateY(20px) scaleY(0.8); }
}

#ring{
opacity:0;
animation:showRing 1s forwards;
animation-delay:4s;
}

@keyframes showRing{
to{ opacity:1; transform:scale(1.2); }
}

.heart{
position:absolute;
color:red;
font-size:20px;
animation:float 5s linear infinite;
}

@keyframes float{
from{ transform:translateY(0); opacity:1; }
to{ transform:translateY(-600px); opacity:0; }
}

#message{
display:none;
font-size:22px;
width:70%;
margin:auto;
margin-top:20px;
}
</style>
</head>

<body>

<h1 id="question">Will You Be My Valentine? ❤️</h1>
<button id="yesBtn" onclick="start()">Yes 💖</button>
<button id="noBtn" onmouseover="moveBtn()">No 😜</button>

<div id="scene">
<svg viewBox="0 0 600 400">

<!-- Girl -->
<circle cx="420" cy="180" r="30" fill="#f4c2c2"/>
<rect x="400" y="210" width="40" height="100" fill="#ff69b4"/>

<!-- Boy -->
<g id="boy">
<circle cx="200" cy="180" r="30" fill="#f4c2c2"/>
<rect id="knee" x="180" y="210" width="40" height="100" fill="#4a90e2"/>
</g>

<!-- Ring -->
<circle id="ring" cx="310" cy="220" r="10" fill="gold"/>

</svg>
</div>

<div id="message"></div>

<script>
function start(){
document.getElementById("yesBtn").style.display="none";
document.getElementById("noBtn").style.display="none";
document.getElementById("question").style.display="none";
document.getElementById("scene").style.display="block";

setTimeout(()=>{
typeMessage("From the moment we started talking, my days became brighter and my nights became magical.You make my heart smile in ways I never knew were possible.I promise to cherish you, support you, and make you laugh every single day.Thank you for being you. 💕Happy Valentine’s Day, my love P❤️❤️JA");
document.getElementById("message").style.display="block";
createHearts();
},5000);
}

function moveBtn(){
const btn=document.getElementById("noBtn");
btn.style.left=Math.random()*window.innerWidth+"px";
btn.style.top=Math.random()*window.innerHeight+"px";
}

function typeMessage(text){
let i=0;
const msg=document.getElementById("message");
const interval=setInterval(()=>{
msg.innerHTML+=text.charAt(i);
i++;
if(i>=text.length) clearInterval(interval);
},40);
}

function createHearts(){
setInterval(()=>{
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤";
heart.style.left=Math.random()*window.innerWidth+"px";
heart.style.top="500px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),5000);
},300);
}
</script>

</body>
</html>
